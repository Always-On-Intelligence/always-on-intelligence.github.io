<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ECCV Poster Hall</title>
  <meta name="description" content="Walk through Poster Session 6 at ECCV 2026 through a pair of always-on glasses.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <link rel="stylesheet" href="world.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
  <script type="module" src="main.mjs"></script>
</head>
<body>
  <main id="app" aria-label="ECCV 2026 poster hall, first-person view through always-on glasses">
    <canvas id="view" tabindex="0" aria-label="3D view. Drag to look around, click to walk, W A S D to move."></canvas>
    <div id="hud" aria-live="polite"></div>
    <div id="loading" role="status">
      <div class="loading-card">
        <p class="loading-kicker">ECCV 2026 · Malmömässan</p>
        <p class="loading-title">Poster Session 6</p>
        <p class="loading-step" data-step>Loading the hall…</p>
        <div class="loading-bar"><span data-bar></span></div>
      </div>
    </div>
  </main>
</body>
</html>
